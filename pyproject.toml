[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handnote"
version = "0.1.0"
description = "Markdown notes to photos of handwritten notes. Local, offline, font based."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
    "opencv-python-headless>=4.8",
    "Pillow>=9.2",
    "markdown-it-py>=3.0",
    "fonttools>=4.40",
    "pypdf>=4.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
handnote = "handnote.cli:main"
handnote-write = "handnote.cli:write_main"
handnote-slides = "handnote.cli:slides_main"

[tool.setuptools.packages.find]
include = ["handnote*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
