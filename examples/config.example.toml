# handnote 配置文件（全部选项，附说明与候选值）
#
# 放在下面任一位置，不加 -c 时会自动读取（先找到的生效）：
#   1. 环境变量 HANDNOTE_CONFIG 指向的文件（设为 none 则不读任何配置文件）
#   2. 当前目录的 handnote.toml
#   3. 用户目录：Linux/macOS 是 ~/.config/handnote/config.toml，Windows 是 %APPDATA%\handnote\config.toml
# 命令行 -c 文件.toml 指定别的文件；--no-config 完全不读；--set 段.键=值 在以上之上再覆盖单项。
# `handnote config --path` 查看当前读到的是哪个文件。
#
# 想改什么就改什么：删掉不想固定的行也可以，缺省的项用内置默认值。
# 键名拼错会直接报错。数值型效果设为 0 即关闭。
# 文件里的相对路径（字体、纸张图片）若在本文件旁边能找到，就按本文件所在目录解释。

# 随机种子：固定后同样的输入得到同样的照片；不设置则每次都不一样
# 候选：整数，如 42；不设置则每次随机
# seed = 42

# ----------------------------------------------------------------------
# [page] 页面几何
# 单位是像素。默认 A4、200 dpi。文字基线落在 margin_top + n × pitch 这条网格上，横线纸的线画在同一网格上。
# ----------------------------------------------------------------------
[page]

# 页宽
# 候选：整数像素；A4@200dpi 为 1654，A5 为 1169（用纸张模板时模板会给出）
width = 1654

# 页高
# 候选：整数像素；A4@200dpi 为 2339，A5 为 1654
height = 2339

# 上边距；也决定横线网格的起点
# 候选：整数像素，100 ~ 200；决定第一行基线和横线的起点
margin_top = 150

# 下边距
# 候选：整数像素，80 ~ 200
margin_bottom = 130

# 左边距
# 候选：整数像素，120 ~ 260
margin_left = 170

# 右边距
# 候选：整数像素，60 ~ 160
margin_right = 100

# 行距，文字基线对齐到这个网格
# 候选：整数像素，52 ~ 72；越小一页越密，字号 = pitch × text.size_ratio
pitch = 64

# ----------------------------------------------------------------------
# [text] 字体、排版、手写抖动、手绘线条
# 字形抖动和线条抖动的每一项设为 0 即关闭；heading_* 的数字是空行数。
# ----------------------------------------------------------------------
[text]

# 正文字体文件，第一个为主字体，后面的只补缺字；留空则自动在 fonts/ 里找
# 候选：字体文件路径或文件名片段的列表，如 ["fonts/LongCang-Regular.ttf", "lxgw"]；[] 为自动
fonts = []

# 标题单独用的字体，留空则同正文
# 候选：字体路径或名片段，如 "mashanzheng"；"" 同正文
heading_font = ""

# 行内代码和代码块单独用的字体，留空则同正文
# 候选：字体路径或名片段；"" 同正文
code_font = ""

# 全角标点单独用的字体；留空则同正文（自动选字体时，龙藏体的标点会借用文楷）
# 候选：字体路径或名片段，如 "lxgw"；"" 同正文（自动选字体时借用文楷）
punct_font = ""

# 英文字母、数字、半角符号单独用的字体；留空则同正文（自动选字体时同样借用文楷）
# 候选：字体路径或名片段，如 "lxgw"；"" 同正文（自动选字体时借用文楷）
latin_font = ""

# 额外的字体目录（fonts 为空时在这里找）
# 候选：目录路径；"" 为只在 ./fonts 和系统字体目录里找
font_dir = ""

# 正文字号 / 行距
# 候选：0.6 ~ 0.85，越大字越大；0.74 为默认
size_ratio = 0.74

# 一到六级标题相对正文的字号倍数
# 候选：六个数，1.0 ~ 2.0；1.0 与正文同大
heading_scales = [1.6, 1.32, 1.16, 1.06, 1.0, 1.0]

# 一到六级标题上方的空行数
# 候选：六个整数，0 ~ 3；0 为不空行
heading_gap_before = [1, 1, 1, 0, 0, 0]

# 一到六级标题下方的空行数
# 候选：六个整数，0 ~ 3；0 为不空行
heading_gap_after = [0, 0, 0, 0, 0, 0]

# 汉字怎么排：ink 按字形笔画的实际左右边界排（字与字之间留 ink_gap），advance 按字体声明的字宽排（再加 letter_spacing）
# 候选：ink | advance
spacing_mode = "ink"

# ink 模式下相邻两字笔画边界之间的空隙，单位 em；可为负
# 候选：-0.05 ~ 0.3；0.08 为默认，0 为笔画边界相贴，越大越疏
ink_gap = 0.08

# ink 模式下一个字（含标点）至少占的宽度，单位 em，避免窄字和标点挤成一团
# 候选：0 ~ 0.6；0 为完全按笔画宽度
ink_min_width = 0.3

# advance 模式下汉字的额外字距，单位 em
# 候选：-0.08 ~ 0.3；0 为字与字紧贴，负数更挤，0.03 为默认，0.15 以上很疏
letter_spacing = 0.03

# 段首缩进，单位 em
# 候选：0 ~ 2；0 顶格，2 为中文常见的空两格
paragraph_indent = 0.0

# 大括号到列表文字的距离，单位 em
# 候选：0.8 ~ 1.6；大括号与文字的距离
list_indent = 1.15

# 大括号列表项前的额外标记：none 或 dot
# 候选：none | dot
list_marker = "none"

# 列表前“短标签：”最长多少字时才挪到括号尖端左侧
# 候选：0 ~ 12；0 为不把标签挪到括号尖角左侧
label_max_chars = 8

# 段内换行：auto 像 Markdown 一样合并，newline 保留
# 候选：auto | newline
softbreak = "auto"

# 表格：list 按行转成括号列表，skip 直接丢弃（表格线永远不画）
# 候选：list | skip
table_mode = "list"

# 引用段整体缩进，单位 em
# 候选：0 ~ 4；0 为不缩进
quote_indent = 2.0

# 首行缩进处的手绘标记：triangle 空心三角，filled 实心三角，none 不画
# 候选：triangle | filled | none
quote_marker = "triangle"

# 代码字号相对正文
# 候选：0.7 ~ 1.0
code_scale = 0.88

# 代码块左侧的手绘竖线
# 候选：true | false
code_rule = true

# 代码用哪支笔：main 正文颜色，accent 第二支笔
# 候选：main | accent
code_pen = "main"

# 每个字的位置抖动，单位 em
# 候选：0 ~ 0.06；0 关闭
pos_jitter = 0.02

# 基线缓慢起伏，单位 em
# 候选：0 ~ 0.06；0 关闭
baseline_wave = 0.025

# 每行随机倾斜角度
# 候选：0 ~ 1.0；0 关闭
line_slope_deg = 0.25

# 单字旋转上限（度）
# 候选：0 ~ 3；0 关闭，1.2 为默认
rotate_deg = 1.2

# 单字缩放抖动
# 候选：0 ~ 0.08；0 关闭
scale_jitter = 0.03

# 单字斜切抖动
# 候选：0 ~ 0.08；0 关闭
shear_jitter = 0.03

# 单字笔画弹性扭曲幅度，单位 em
# 候选：0 ~ 0.03；0 关闭，0.008 工整，0.02 已经很潦草
warp_amp = 0.008

# 上述扭曲的平滑程度，单位 em
# 候选：0.05 ~ 0.2；越大扭曲越平缓
warp_sigma = 0.1

# 笔画粗细变化（也用于手绘线条的粗细变化）
# 候选：0 ~ 0.2；0 关闭
thickness_jitter = 0.06

# 字内墨色深浅变化
# 候选：0 ~ 0.3；0 关闭
pressure_var = 0.12

# 行与行、笔画与笔画之间的墨色深浅变化
# 候选：0 ~ 0.2；0 关闭
line_gain_var = 0.08

# 线条的弯曲抖动，单位 em；0 为尺子般笔直
# 候选：0 ~ 0.15；0 为尺子般笔直，0.05 为默认
line_wobble = 0.05

# 直线的随机倾斜角度
# 候选：0 ~ 3；0 关闭
line_tilt_deg = 0.8

# 笔画首末随机多出的长度上限，单位 em
# 候选：0 ~ 0.6；0 为首末不超出
line_overshoot = 0.3

# 笔宽相对字号
# 候选：0.03 ~ 0.07；越大笔越粗
line_width = 0.047

# 大括号尖角距顶部的高度比例，0.25 即 2/8
# 候选：0.1 ~ 0.5；0.25 即大括号纵向 2/8 处，0.5 为正中
brace_tip = 0.25

# 主笔颜色：black / blue / blue-black / red / green
# 候选：black | blue | blue-black | red | green
ink = "black"

# 第二支笔颜色
# 候选：black | blue | blue-black | red | green
accent = "red"

# ----------------------------------------------------------------------
# [paper] 稿纸
# template 可以是 ruled / blank / grid、纸张模板 .toml、或一张纸张图片。
# ----------------------------------------------------------------------
[paper]

# 稿纸类型：ruled 横线纸，blank 白纸，grid 方格纸
# 候选：ruled | blank | grid
kind = "ruled"

# 纸张模板：builtin 名、模板 .toml 或纸张图片，见 README
# 候选："" | ruled | blank | grid | "路径/模板.toml" | "路径/纸张.jpg"
template = ""

# 直接指定纸张图片（模板会填这一项）
# 候选："" 或纸张图片路径
image = ""

# 图片适配页面：cover 裁剪铺满，stretch 拉伸
# 候选：cover | stretch
image_fit = "cover"

# 纸色
# 候选：[R, G, B]，如 [247, 245, 238] 米白，[255, 255, 255] 纯白，[240, 232, 210] 泛黄
color = [247, 245, 238]

# 印刷横线颜色
# 候选：[R, G, B]，如 [150, 182, 208] 浅蓝，[200, 200, 200] 浅灰
line_color = [150, 182, 208]

# 印刷横线粗细（像素）
# 候选：整数 1 ~ 4
line_width = 2

# 印刷横线深浅不均；0 为完全均匀
# 候选：0 ~ 0.3；0 为完全均匀
line_var = 0.1

# 左侧红色竖线
# 候选：true | false
margin_line = false

# 纸张颗粒强度；0 关闭
# 候选：0 ~ 0.03；0 关闭
grain = 0.012

# 纸色缓慢不均；0 关闭
# 候选：0 ~ 0.03；0 关闭
tint_var = 0.012

# 随机污渍最多几处；0 关闭
# 候选：整数 0 ~ 5；0 关闭
stain_count = 2

# 污渍深浅
# 候选：0 ~ 0.4
stain_strength = 0.16

# 污渍直径下限，占页宽比例
# 候选：0.01 ~ 0.03
stain_min = 0.015

# 污渍直径上限，占页宽比例
# 候选：0.03 ~ 0.08
stain_max = 0.05

# 污渍颜色
# 候选：[R, G, B]，如 [150, 112, 62] 茶渍
stain_color = [150, 112, 62]

# ----------------------------------------------------------------------
# [photo] 拍照效果
# 每一项数值设为 0（或 shadow = "none"）即关闭对应效果；enabled = false 整体关闭拍照阶段。
# ----------------------------------------------------------------------
[photo]

# false 则只输出平整的稿纸图，不做任何拍照效果
# 候选：true | false；false 则只输出平整的稿纸图
enabled = true

# 纸四周露出的桌面宽度，占长边比例
# 候选：0 ~ 0.15
pad = 0.07

# 纸摆得不正：纸的四角随机位移，占页宽比例（只动纸，不动桌面）；0 关闭
# 候选：0 ~ 0.05；0 关闭
perspective = 0.025

# 纸在画面内的随机旋转（度，标准差）；0 关闭
# 候选：0 ~ 3；0 关闭
rotation = 1.2

# 手机倾斜角度下限（度）
# 候选：0 ~ 15（度）；3 ~ 8 是随手拍的常见范围
tilt_min = 3.0

# 倾斜角度上限（度），每张照片在两者之间随机取值；0 关闭倾斜
# 候选：0 ~ 20（度）；0 关闭倾斜；超过 15 就很夸张
tilt_max = 8.0

# 哪一侧离镜头更远（画面里变窄）：top 纸的上端（手机上端仰起）/ bottom / left / right / random，也可写角度数字，0=上端，顺时针
# 候选：top | bottom | left | right | random | 角度数字如 "30"（0=上端，顺时针）
tilt_direction = "top"

# 倾斜方向在上述方向附近随机偏转的最大角度（度）；0 为方向固定
# 候选：0 ~ 45（度）；0 为方向固定
tilt_direction_jitter = 10.0

# 镜头焦距，相对画面对角线；越小透视越夸张，越大越接近正视
# 候选：0.5 ~ 1.5；0.8 约等于手机主摄，越小透视越夸张
focal_length = 0.8

# 整页平缓起伏，占短边比例；0 关闭
# 候选：0 ~ 0.006；0 关闭
bend = 0.0025

# 每条边各自随机弯曲一点（方向随机），幅度下限，占短边比例
# 候选：0 ~ 0.01；与 max 一起决定每条边的弯曲幅度
edge_bow_min = 0.004

# 幅度上限；设 0 则边缘笔直
# 候选：0 ~ 0.02；0 则边缘笔直
edge_bow_max = 0.01

# 某个角朝镜头或背离镜头翘起的幅度，占页宽比例；0 关闭
# 候选：0 ~ 0.04；0 关闭
corner_lift = 0.018

# 出现翘角的概率
# 候选：0 ~ 1
corner_lift_prob = 0.8

# 出现折角的概率；0 关闭
# 候选：0 ~ 1；0 从不出现折角
dog_ear_prob = 0.3

# 折角直角边长下限，占页宽比例
# 候选：0.02 ~ 0.05
dog_ear_min = 0.03

# 折角直角边长上限
# 候选：0.04 ~ 0.1
dog_ear_max = 0.06

# 这张纸后面垫着几张纸，错落露出边缘；0 关闭
# 候选：整数 0 ~ 6；0 关闭，2 ~ 4 像一沓纸
stack_count = 0

# 每张纸比上一张多错开的最大距离，占页宽比例
# 候选：0.005 ~ 0.03
stack_offset = 0.012

# 每张纸各自随机转的角度上限（度）
# 候选：0 ~ 3（度）；0 为每张摆得很齐
stack_rotation = 1.0

# 纸堆朝哪个方位露出：random / top-left / top / top-right / left / right / bottom-left / bottom / bottom-right
# 候选：random | top-left | top | top-right | left | right | bottom-left | bottom | bottom-right
stack_direction = "random"

# 纸落在桌面上的阴影深浅；0 关闭
# 候选：0 ~ 1；0 关闭
paper_shadow = 0.55

# 桌面颜色
# 候选：[R, G, B]，如 [92, 74, 62] 木色，[60, 60, 64] 深灰
desk_color = [92, 74, 62]

# 桌面木纹强度；0 为纯色
# 候选：0 ~ 2；0 为纯色
desk_texture = 1.0

# 投影形状：random / phone 手机 / window 窗框 / none 关闭
# 候选：random | phone | window | none
shadow = "random"

# 手机阴影在画面的哪个方位：random / top-left / top / top-right / left / right / bottom-left / bottom / bottom-right；指定后 shadow=random 时固定用手机阴影，window 不受影响
# 候选：random | top-left | top | top-right | left | right | bottom-left | bottom | bottom-right
shadow_position = "random"

# 投影深浅
# 候选：0 ~ 0.6
shadow_strength = 0.3

# 整体明暗渐变；0 关闭
# 候选：0 ~ 0.4；0 关闭
light_gradient = 0.16

# 暗角；0 关闭
# 候选：0 ~ 0.5；0 关闭
vignette = 0.2

# 白平衡偏色；0 关闭
# 候选：0 ~ 0.04；0 关闭
color_cast = 0.015

# 随机伽马漂移；0 关闭
# 候选：0 ~ 0.15；0 关闭
tone_var = 0.05

# 镜头模糊（像素）；0 关闭
# 候选：0 ~ 2（像素）；0 关闭
blur = 0.7

# 模糊后的锐化；0 关闭
# 候选：0 ~ 1；0 关闭
sharpen = 0.35

# 传感器噪点（0-255 刻度）；0 关闭
# 候选：0 ~ 8；0 关闭
noise = 3.0

# 保存 JPEG 的质量
# 候选：整数 60 ~ 95
jpeg_quality = 86

# ----------------------------------------------------------------------
# [llm] 本地模型（handnote write 用）
# 指向一个 OpenAI 兼容的服务，例如 llama.cpp 的 llama-server。提示词内置在程序里，这里只配连接和采样。
# ----------------------------------------------------------------------
[llm]

# 模型服务地址（llama-server 的 --host）
# 候选：主机名或 IP，如 "127.0.0.1"、"192.168.1.5"
host = "127.0.0.1"

# 模型服务端口（llama-server 的 --port）
# 候选：整数端口，llama-server 默认 8080
port = 8080

# 完整的 OpenAI 兼容地址，如 http://192.168.1.5:8080/v1；留空则用 host 和 port
# 候选："" | "http://主机:端口/v1"；填了就忽略 host 和 port
base_url = ""

# 请求里写的模型名（llama-server 单模型时基本忽略，多模型/代理时用来选模型）
# 候选：模型名字符串，如 "qwen3.6-35b-a3b"
model = "qwen3.6-35b-a3b"

# 服务要求鉴权时填；本机一般留空
# 候选："" | 密钥字符串
api_key = ""

# 采样温度，越低越稳
# 候选：0 ~ 1.2；0.4 ~ 0.8 比较稳
temperature = 0.6

# 核采样
# 候选：0.8 ~ 1.0
top_p = 0.95

# 一次最多生成多少 token
# 候选：整数，2048 ~ 8192；两页笔记约 1500 token
max_tokens = 4096

# 是否让模型先思考再写（Qwen3 一类；关闭更快，笔记不需要长推理）
# 候选：true | false
thinking = false

# 单次请求最长等待秒数（本地大模型首个字可能要等很久）
# 候选：整数秒，120 ~ 1800
timeout = 900

# 检查不通过时最多让模型改几轮；0 为不改
# 候选：整数 0 ~ 5；0 为检查出问题也不让模型改
fix_rounds = 3

# 生成的笔记 .md 存放目录
# 候选：目录路径，如 "notes"
notes_dir = "notes"

# 课件文字超过这么多字时，先分段让模型提炼要点，再用要点写笔记（按模型上下文大小调）
# 候选：整数，3000 ~ 30000；模型上下文越大可以越大
chunk_chars = 9000
